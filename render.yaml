# Blueprint Render — Static Site frontend (monorepo g6TeachTrack)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: g6-teach-track-web
    runtime: static
    repo: https://github.com/dgbjkrist/g6TeachTrack
    branch: main
    rootDir: univirtuelle
    buildCommand: bash scripts/render-build.sh
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20.15.0"
      - key: VITE_API_URL
        sync: false

  - type: web
    name: g6-teach-track-api
    runtime: node
    repo: https://github.com/dgbjkrist/g6TeachTrack
    branch: main
    rootDir: backend-pct
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20.15.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
